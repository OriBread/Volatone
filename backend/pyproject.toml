[project]
name = "volatone"
version = "0.1.0"
description = "Volatone: Sonifying live market data - backend API and sonification engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>1.13.0",
    "psycopg2-binary>=2.9.9", # Needed by Alembic for sync migration env
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volatone"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, UP: modern syntax,
# B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
